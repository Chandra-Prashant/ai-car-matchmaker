[project]
name = "ai-car-matchmaker-backend"
version = "0.1.0"
description = "Multistep agent backend for the AI Car Matchmaker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.1",
    "claude-agent-sdk>=0.2.95",
    "anthropic>=0.121.0",
    "openai>=2.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
